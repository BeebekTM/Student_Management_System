<h1>Student List</h1>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.age }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No Students Found</td>
    </tr>
    {% endfor %}
</table>
