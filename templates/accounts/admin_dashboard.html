{% extends 'base.html' %}

{% block content %}

<h1>Admin Dashboard</h1>

<div class="dashboard-grid">

    <div class="card">
        <h3>Total Students</h3>
        <h2>{{ student_count }}</h2>
    </div>

    <div class="card">
        <h3>Total Courses</h3>
        <h2>{{ course_count }}</h2>
    </div>

    <div class="card">
        <h3>Total Attendance</h3>
        <h2>{{ attendance_count }}</h2>
    </div>

    <div class="card">
        <h3>Total Grades</h3>
        <h2>{{ grade_count }}</h2>
    </div>

</div>

{% endblock %}
