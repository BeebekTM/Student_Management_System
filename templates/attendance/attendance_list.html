{% extends 'base.html' %} {% block content %}

<h1>Attendance Records</h1>

<form method="GET">
  <input type="date" name="date" />

  <button type="submit">Filter</button>
</form>

<table border="1">
  <tr>
    <th>Student</th>
    <th>Course</th>
    <th>Date</th>
    <th>Status</th>
  </tr>

  {% for record in records %}

  <tr>
    <td>{{ record.student }}</td>
    <td>{{ record.course }}</td>
    <td>{{ record.date }}</td>
    <td>{{ record.status }}</td>
  </tr>

  {% endfor %}
</table>

{% endblock %}
